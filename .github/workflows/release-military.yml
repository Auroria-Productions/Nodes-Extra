name: Build and publish Nodes-Military v1.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-military.yml'
      - 'release-inputs/nodes-military-source-v1.1.0.tar.xz'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nodes-military-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and import full source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s release-inputs/nodes-military-source-v1.1.0.tar.xz
          echo "a4c898ebe43e0a4fa23dc701639453497e52b4d97b3771d92b46c82c97a23798  release-inputs/nodes-military-source-v1.1.0.tar.xz" | sha256sum -c -
          tar -tJf release-inputs/nodes-military-source-v1.1.0.tar.xz > /dev/null
          tar -xJf release-inputs/nodes-military-source-v1.1.0.tar.xz -C .
          test -f src/main/java/com/auroria/nodesmilitary/MilitaryGui.java
          test -f src/main/resources/plugin.yml
          test -f src/test/java/com/auroria/nodesmilitary/MilitaryRegressionTest.java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Nodes-Military JAR
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests package
          mkdir -p dist
          cp target/Nodes-Military.jar dist/Nodes-Military.jar
          unzip -t dist/Nodes-Military.jar | tail -1
          unzip -p dist/Nodes-Military.jar plugin.yml | grep -F 'version: 1.1.0'
          if jar tf dist/Nodes-Military.jar | grep -E '^(phonon/nodes/|net/md_5/bungee/)'; then
            echo "::error::Compile-only API stubs leaked into production JAR"
            exit 1
          fi

      - name: Run offline save-compatibility and routing tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          java -cp "target/test-classes:target/classes:$(cat target/classpath.txt)" com.auroria.nodesmilitary.MilitaryRegressionTest

      - name: Package readable source project
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r dist/Nodes-Military-v1.1.0-Source.zip \
            src README.md CHANGELOG.md TEST_REPORT.md CI-BUILD.md LICENSE build.sh pom.xml
          unzip -t dist/Nodes-Military-v1.1.0-Source.zip | tail -1
          sha256sum dist/Nodes-Military.jar dist/Nodes-Military-v1.1.0-Source.zip

      - name: Commit readable source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md CHANGELOG.md TEST_REPORT.md CI-BUILD.md LICENSE build.sh pom.xml
          if git ls-files --error-unmatch Nodes-Extra-v1.1.0-GitHub-Ready.zip >/dev/null 2>&1; then
            git rm Nodes-Extra-v1.1.0-GitHub-Ready.zip
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Import Nodes-Military v1.1.0 readable source project"
            git push origin HEAD:main
          fi

      - name: Attach separate JAR and source ZIP to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 \
              "dist/Nodes-Military.jar#Nodes-Military.jar" \
              "dist/Nodes-Military-v1.1.0-Source.zip#Nodes-Military-v1.1.0-Source.zip" --clobber
          else
            gh release create v1.1.0 \
              "dist/Nodes-Military.jar#Nodes-Military.jar" \
              "dist/Nodes-Military-v1.1.0-Source.zip#Nodes-Military-v1.1.0-Source.zip" \
              --target "$(git rev-parse HEAD)" \
              --title "Nodes-Military v1.1.0 — GUI Edition" \
              --notes "GUI for national armies, divisions, ranks, enlistment, appointments and strategic orders. v1.0.0-compatible save fields, optional read-only Nodes-Extra support, and atomic backup saves. Offline tests passed; live two-player Paper validation remains outstanding."
          fi
          gh release view v1.1.0 --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'
