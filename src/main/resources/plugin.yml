name: Nodes-Military
main: com.auroria.nodesmilitary.MilitaryPlugin
version: 1.1.0
api-version: '1.21'
authors: [Auroria-Productions]
description: Military organisations, ranks, strategic commands and secure inventory GUIs for MilzzyNodes
folia-supported: false
depend: [milzzynodes]
softdepend: [Nodes-Extra]
commands:
  nmilitary:
    description: Nodes-Military commands and GUI
    aliases: [nodesmilitary, nmil]
    permission: nodesmilitary.use
    usage: /nmilitary help
permissions:
  nodesmilitary.use:
    description: Use national military commands and menus
    default: true
  nodesmilitary.admin:
    description: Global military administration
    default: op
